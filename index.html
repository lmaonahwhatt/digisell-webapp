
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiSell Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="logo_bot.png" alt="DigiSell" class="logo">
        <h2 class="slogan">Выберите интересующую вас категорию:</h2>
          <div class="buttons">
            <button class="btn btn-1">
              <img src="Steam_icon_logo.png" alt="Steam" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Steam</div>
                <div class="btn-subtitle">Игры, Пополнение баланса, Аккаунты</div>
              </div>
            </button>

            <button class="btn btn-2">
              <img src="Spotify.png" alt="Spotify" class="btn-icon">
                <div class="btn-content">
                  <div class="btn-title">Подписки</div>
                  <div class="btn-subtitle">Spotify, Youtube, ChatGPT</div>
                </div>
            </button>

            <button class="btn btn-3">
              <img src="Telegram.png" alt="Telegram" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Telegram</div>
                <div class="btn-subtitle">Premium, Звезды</div>
              </div>
            </button>

            <button class="btn btn-4">
              <img src="Apple.png" alt="Apple" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Apple iTunes</div>
                <div class="btn-subtitle">Подарочные карты</div>
              </div>
          </button>
          </div>
          <div class="contacts">
    <div class="contacts-text">Новости, скидки, события:</div>
    
    <div class="contacts-buttons">
  <a href="https://t.me/YOUR_CHANNEL" class="contact-btn telegram-btn" target="_blank">
    <img src="Telegram.png" alt="Telegram" class="btn-icon-small">
    Telegram
  </a>
  
  <a href="https://vk.com/YOUR_GROUP" class="contact-btn vk-btn" target="_blank">
    <img src="VK.png" alt="VK" class="btn-icon-small">
    ВКонтакте
  </a>
</div>
  </div>
</div>
      </div>
    </div>
  </body>
</html>
