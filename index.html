<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiSell Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>

  setTimeout(() => {
    document.querySelector('.contacts-text').style.opacity = '1';
    document.querySelector('.contacts-text').style.transform = 'translateY(0)';

  setTimeout(() => {
    document.querySelectorAll('.contact-btn').forEach((btn, index) => {

    <script>
window.Telegram?.WebApp?.ready();

const tg = window.Telegram.WebApp;
const mainBtn = tg.MainButton;
const backBtn = tg.BackButton;

// ИНИЦИАЛИЗАЦИЯ КНОПОК
mainBtn.text = '🏠 Категории';
mainBtn.color = '#007AFF';
mainBtn.textColor = 'white';
backBtn.show();

// АНИМАЦИИ (старые)
setTimeout(() => {
  document.querySelector('.contacts-text').style.opacity = '1';
  document.querySelector('.contacts-text').style.transform = 'translateY(0)';
}, 3000);

setTimeout(() => {
  document.querySelectorAll('.contact-btn').forEach((btn, index) => {
    setTimeout(() => {
      btn.style.opacity = '1';
      btn.style.transform = 'translateY(0) scale(1)';
    }, index * 200);
  });
}, 3200);

// НАВИГАЦИЯ
let currentPage = 'categories';

function showCategories() {
  document.querySelector('.header').style.display = 'block';
  document.querySelector('.contacts').style.display = 'block';
  document.querySelector('.category-page')?.remove();
  document.querySelector('.favorites-page')?.remove();
  document.querySelector('.cart-page')?.remove();
  
  mainBtn.text = '🏠 Категории';
  tg.MainButton.hide();
  tg.SecondaryButton.hide();
  backBtn.hide();
  currentPage = 'categories';
}

function showCategory(category) {
  document.querySelector('.header').style.display = 'none';
  document.querySelector('.contacts').style.display = 'none';
  
  const categoryPage = document.createElement('div');
  categoryPage.className = 'category-page';
  categoryPage.id = 'category-' + category;
  categoryPage.innerHTML = `
    <div class="category-header">
      <button onclick="showCategories()" class="back-btn">← Назад</button>
      <h2>${category}</h2>
    </div>
    <div class="products">
      <p>🎮 Товары категории <strong>${category}</strong></p>
    </div>
  `;
  document.querySelector('.container').appendChild(categoryPage);
  
  // ✅ MAIN + SECONDARY кнопки
  mainBtn.text = category;
  mainBtn.onClick(() => showCategories());
  mainBtn.show();
  
  tg.SecondaryButton.text = '❤️ Избранное';
  tg.SecondaryButton.position = 'left';
  tg.SecondaryButton.color = '#FF3B30';
  tg.SecondaryButton.textColor = 'white';
  tg.SecondaryButton.onClick(() => showFavorites());
  tg.SecondaryButton.show();
  
  backBtn.onClick(showCategories);
  backBtn.show();
  currentPage = category;
}

function showFavorites() {
  const favoritesPage = document.createElement('div');
  favoritesPage.className = 'favorites-page';
  favoritesPage.innerHTML = `
    <div class="category-header">
      <button onclick="showCategories()" class="back-btn">← Категории</button>
      <h2>❤️ Избранное</h2>
    </div>
    <div class="products">⭐ Ваши избранные товары</div>
  `;
  document.querySelector('.container').appendChild(favoritesPage);
  
  mainBtn.text = '🛒 Корзина';
  mainBtn.onClick(() => showCart());
  mainBtn.show();
  
  tg.SecondaryButton.text = '🏠 Категории';
  tg.SecondaryButton.onClick(() => showCategories());
  currentPage = 'favorites';
}

function showCart() {
  const cartPage = document.createElement('div');
  cartPage.className = 'cart-page';
  cartPage.innerHTML = `
    <div class="category-header">
      <button onclick="showCategories()" class="back-btn">← Категории</button>
      <h2>🛒 Корзина</h2>
    </div>
    <div class="products">💳 Оформление заказа</div>
  `;
  document.querySelector('.container').appendChild(cartPage);
  
  mainBtn.text = '✅ Оформить';
  mainBtn.onClick(() => alert('Заказ оформлен!'));
  mainBtn.color = '#34C759';
  mainBtn.show();
  
  tg.SecondaryButton.text = '❤️ Избранное';
  tg.SecondaryButton.onClick(() => showFavorites());
  currentPage = 'cart';
}

// Обработчики категорий
document.addEventListener('DOMContentLoaded', () => {
  document.querySelector('.btn-1').onclick = () => showCategory('Steam');
  document.querySelector('.btn-2').onclick = () => showCategory('Подписки');
  document.querySelector('.btn-3').onclick = () => showCategory('Telegram');
  document.querySelector('.btn-4').onclick = () => showCategory('Apple');
});
</script>



    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="logo_bot.png" alt="DigiSell" class="logo">
        <h2 class="slogan">Выберите интересующую вас категорию:</h2>
          <div class="buttons">
            <button class="btn btn-1">
              <img src="Steam_icon_logo.png" alt="Steam" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Steam</div>
                <div class="btn-subtitle">Игры, Пополнение баланса, Аккаунты</div>
              </div>
            </button>

            <button class="btn btn-2">
              <img src="Spotify.png" alt="Spotify" class="btn-icon">
                <div class="btn-content">
                  <div class="btn-title">Подписки</div>
                  <div class="btn-subtitle">Spotify, Youtube, ChatGPT</div>
                </div>
            </button>

            <button class="btn btn-3">
              <img src="Telegram.png" alt="Telegram" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Telegram</div>
                <div class="btn-subtitle">Premium, Звезды</div>
              </div>
            </button>

            <button class="btn btn-4">
              <img src="Apple.png" alt="Apple" class="btn-icon">
              <div class="btn-content">
                <div class="btn-title">Apple iTunes</div>
                <div class="btn-subtitle">Подарочные карты</div>
              </div>
          </button>
          </div>
          <div class="contacts">
    <div class="contacts-text">Новости, скидки, события:</div>
    
    <div class="contacts-buttons">
  <a href="https://t.me/digiselloff" class="contact-btn telegram-btn" target="_blank">
    <img src="Telegram.png" alt="Telegram" class="btn-icon-small">
    Telegram
  </a>
  
  <a href="https://vk.com/digiselloff?t2fs=71c1f7ee1d06271a1c_2P" class="contact-btn vk-btn" target="_blank">
    <img src="VK.png" alt="VK" class="btn-icon-small">
    ВКонтакте
  </a>
</div>
  </div>
</div>
      </div>
    </div>
  </body>
</html>
